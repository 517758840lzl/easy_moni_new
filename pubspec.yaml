name: easy_moni
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  camera: 0.12.0+1
  flutter_riverpod: 3.3.2-dev.2
  riverpod_annotation: 4.0.3-dev.2
  # Routing
  go_router: 17.2.3
  webview_flutter: 4.13.0

  # Networking
  dio: 5.9.2

  # Logging
  talker: 5.1.17
  talker_riverpod_logger: 5.1.17

  # UI Components
  pull_to_refresh: 2.0.0
  flutter_svg: 2.2.3

  # Utils
  freezed_annotation: 3.1.0
  json_annotation: 4.12.0
  image: 4.8.0
  equatable: 2.0.8
  shared_preferences: 2.5.3
  appsflyer_sdk: 6.17.8
  app_tracking_transparency: 2.0.6+1
  encrypt: 5.0.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  build_runner: 2.15.0
  riverpod_generator: 4.0.4-dev.3
  freezed: 3.2.6-dev.1
  json_serializable: 6.14.0
  flutter_gen_runner: 5.14.1
flutter:
  uses-material-design: true
  assets:
    - assets/images/
flutter_gen:
  output: lib/gen/
