name: easy_moni
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: 3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: 3.3.2-dev.2
  riverpod_annotation: 4.0.3-dev.2
  # Routing
  go_router: 17.2.3

  # Networking
  dio: 5.9.2

  # Logging
  talker: 5.1.17
  talker_flutter: 5.1.17
  talker_dio_logger: 5.1.17
  talker_riverpod_logger: 5.1.17

  # UI Components
  pull_to_refresh: 2.0.0

  # Utils
  freezed_annotation: 3.1.0
  json_annotation: 4.12.0
  equatable: 2.0.8
  shared_preferences: 2.5.3
  

  appsflyer_sdk: 6.17.8
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  build_runner: 2.15.0
  riverpod_generator: 4.0.4-dev.3
  freezed: 3.2.6-dev.1
  json_serializable: 6.14.0
  flutter_gen_runner: 5.14.1
flutter:
  uses-material-design: true
  assets:
    - assets/images/
flutter_gen:
  output: lib/gen/
